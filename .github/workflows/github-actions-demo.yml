name: Run test when push
on: 
  pull_request:
   types: [labeled]
jobs:
  downloadRepostitroy:
    if: github.event.label.name == 'good to merge'
    runs-on: ubuntu-latest
    steps:
      - name: download github repositroy
        uses: actions/checkout@v7
      - name: set up node servier
        uses: actions/setup-node@v7
      - name: install dependencies
        run: npm ci
      - name: Running test cases
        run: npm test