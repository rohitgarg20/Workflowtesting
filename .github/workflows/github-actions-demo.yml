name: Run test when push
on: 
  pull_request:
   types: [labeled]
env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  downloadRepostitroy:
    if: github.event.label.name == 'good to merge'
    runs-on: ubuntu-latest
    steps:
      - name: download github repositroy
        uses: actions/checkout@v7
      - name: set up node servier
        uses: actions/setup-node@v7
      - name: install dependencies
        run: npm ci
      - name: Running test cases
        run: npm test
  buildRelease:
    runs-on: ubuntu-latest
    needs: downloadRepostitroy
    steps:
      - name: download github repositroy
        uses: actions/checkout@v7
      - name: set up node servier
        uses: actions/setup-node@v7
      - name: install dependencies
        run: npm ci
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'
      - name: decode keystore
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > android/app/release.jks
      - name: build release apk
        env: 
          KEYSTORE_FILE: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

